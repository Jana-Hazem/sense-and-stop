# E5 / Member 6B v3 - hypothetical numerical control study (no clinical meaning). Control = stripe g(x,t) = g0 * zone(x) * gate(t), uniform in y.
#   u_t = D u_xx + k*(u(1-u)(u-a) - v) - g(x,t) u      (g = 0: identical to Member 3)
output:
  dir: results/E5_control/runs
  quick_dir: results/E5_control/quick_smoke
target:
  x_mm: 18.0                 # only used if event_estimate.json has no target_x_mm
event:
  method_key: B
plant:
  D_factor: 1.0              # the "real" plant; the planner always uses the nominal model
  k_factor: 1.0
protected_region: {x_min: 20.0, x_max: 28.0}
intervention:
  width_mm: 3.0
  edge_mm: 0.5
  ramp_s: 5.0
  margin_front_mm: 1.0
  margin_protect_mm: 0.5
bounds:
  t_obs_s: 150.0
  start_max_s: null
  duration_s: [10.0, 200.0]
  strength_per_s: [0.0, 2.0]
objective:
  damage_exponent: 2.0
  effort_weight: 0.1
  block_fraction: 0.1        # peak in protected region < 10% of uncontrolled peak = "blocked"
estimation:
  detect_fraction: 0.3
  front_window_s: 60.0
  min_points: 3
planning:                    # the ONE robust plan must block the wave for all of these cases
  timing_halfwidth_s: auto   # auto = largest |timing estimate| of Member 5, rounded up to 5 s, between auto_min_s and auto_max_s; or a number
  auto_from_methods: [B_model]   # reconstruction methods whose timing errors set S (event estimates always count)
  auto_min_s: 10
  auto_max_s: 30
  model_factors: [[1, 1], [0.9, 1], [1.1, 1]]     # [D factor, k factor] guards against model error
  tradeoff_halfwidths_s: [0, 5, 10, 20, 30]       # used with --tradeoff
evaluation:
  plant_cases: [[1, 1], [0.9, 1], [1.1, 1], [1, 0.9], [1, 1.1]]
robustness:
  timing_shifts_s: [-30, -20, -10, 0, 10, 20, 30]
  tolerance_s: 10
search:
  seed: 0
  popsize: 6
  maxiter: 20
  tol: 1.0e-3
  polish_maxiter: 30
  dt_target_s: 0.5
